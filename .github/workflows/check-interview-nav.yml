name: Check interview navigation

on:
  pull_request:
    paths:
      - 'docs/interviews/**'
      - 'mkdocs.yml'
      - 'scripts/check-interview-nav.py'
  push:
    branches: [main]
    paths:
      - 'docs/interviews/**'
      - 'mkdocs.yml'
      - 'scripts/check-interview-nav.py'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-interview-nav.py
